<?xml version="1.0" encoding="UTF-8"?>
<!--
  1号员工 / SPEC.AI 品牌标记（网站端重绘版）
  图形：Pi 形（P 字母 + i 点），源自仓库 logo/logo.svg 的官方几何
  颜色：品牌红褐 #c25b43（D+B 体系暗色模式主行动色，呼应 App 图标红 #842018）
  说明：原 specai-logo.svg 为自动追踪产物，渲染质量差（半透明覆盖+内容偏位），
        此版本为干净几何重绘，任何尺寸下均清晰。若产品端有正式品牌文件，替换本文件即可。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- P shape: outer boundary clockwise, inner hole counter-clockwise -->
  <path fill="#c25b43" fill-rule="evenodd" d="
    M165.29 165.29
    H517.36
    V400
    H400
    V517.36
    H282.65
    V634.72
    H165.29
    Z
    M282.65 282.65
    V400
    H400
    V282.65
    Z
  "/>
  <!-- i dot -->
  <path fill="#c25b43" d="M517.36 400 H634.72 V634.72 H517.36 Z"/>
</svg>
